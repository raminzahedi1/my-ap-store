<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اپ‌استور من</title>
<style>
body {
  margin: 0;
  font-family: Tahoma, sans-serif;
  background: #f3f5fa;
  color: #222;
}
header {
  background: #673ab7;
  color: white;
  padding: 25px;
  text-align: center;
}
h1 { margin: 0; }
.container { padding: 20px; }
.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 15px;
  box-shadow: 0 3px 10px #ddd;
}
button {
  background: #673ab7;
  color: white;
  border: 0;
  padding: 12px 25px;
  border-radius: 10px;
}
</style>
</head>
<body>
<header>
<h1>اپ‌استور من</h1>
<p>دنیایی از برنامه‌های کاربردی</p>
</header>
<div class="container">
<h2>برنامه‌های پیشنهادی</h2>
<div class="card">
<h3>برنامه‌های سرگرمی</h3>
<p>به‌زودی برنامه‌های جذاب اینجا قرار می‌گیرند.</p>
<button>مشاهده برنامه‌ها</button>
</div>
<div class="card">
<h3>برنامه‌های کاربردی</h3>
<p>بهترین ابزارها در یک جا</p>
<button>مشاهده برنامه‌ها</button>
</div>
</div>
</body>
</html>
